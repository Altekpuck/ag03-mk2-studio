name: Publication

# Pousser une étiquette « v0.1.0 » publie l'installeur Windows.
# (Version Linux : pas encore testée sur une vraie machine, donc pas publiée.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Installeur (Inno Setup, préinstallé sur les machines GitHub)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installeur\ag03studio.iss'
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
