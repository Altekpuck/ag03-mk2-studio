[package]
name = "ag03ctl"
version = "0.1.0"
edition = "2024"
authors = ["Lopjoy"]
license = "Apache-2.0"
description = "Contrôle complet de la Yamaha AG03 MK2 (AG03 MK2 Studio et ag03ctl)"

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
